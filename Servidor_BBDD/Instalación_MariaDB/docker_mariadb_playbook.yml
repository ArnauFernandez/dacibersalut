- name: Instalación de Docker y MariaDB en Docker
  hosts: mariadb_dcsBBDD
  become: true
  vars_files:
    - vault_secrets.yml

  tasks:
    - name: Configurar DNS en /etc/resolv.conf
      lineinfile:
        path: /etc/resolv.conf
        line: "{{ item }}"
        state: present
      loop:
        - "nameserver 8.8.8.8"
        - "nameserver 1.1.1.1"

    - name: Instalar dependencias necesarias
      apt:
        name:
          - lsb-release
          - ca-certificates
          - apt-transport-https
          - software-properties-common
          - curl
        state: present
        update_cache: yes

    - name: Instalar Docker y Docker Compose
      apt:
        name:
          - docker.io
          - docker-doc
          - containerd
          - docker-compose
        state: present

    - name: Iniciar el servicio Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Verificar que Docker esté corriendo
      command: docker ps
      register: docker_status
      failed_when: docker_status.rc != 0
      changed_when: false

    - name: Crear directorio para MariaDB
      file:
        path: /srv/mariadb
        state: directory
        mode: '0755'

    - name: Pull de la imagen de MariaDB
      docker_image:
        name: mariadb:latest
        source: pull

    - name: Crear volumen para MariaDB
      docker_volume:
        name: ohv
        state: present

    - name: Mostrar las variables de Vault
      debug:
        msg:
          - "MYSQL_ROOT_PASSWORD: {{ MYSQL_ROOT_PASSWORD }}"
          - "MYSQL_DATABASE: {{ MYSQL_DATABASE }}"
          - "MYSQL_USER: {{ MYSQL_USER }}"
          - "MYSQL_PASSWORD: {{ MYSQL_PASSWORD }}"
          - "DB_PASSWORD: {{ DB_PASSWORD }}"

    - name: Copiar archivo .env al contenedor
      shell: cp .env /srv/mariadb/.env

    - name: Copiar my.cnf
      copy:
        src: templates/my.cnf
        dest: /srv/mariadb/my.cnf
        mode: '0755'

    - name: Copiar docker-compose.yml
      copy:
        src: ./docker-compose.yml
        dest: /srv/mariadb/docker-compose.yml
        mode: '0755'

    - name: Ejecutar docker-compose up -d
      command: docker-compose --env-file /srv/mariadb/.env up -d
      args:
        chdir: /srv/mariadb

    - name: Copiar archivo .env al contenedor
      shell: cp dacibersalut/Servidor_BBDD/Instalación_MariaDB/setup_openhospital.sh /srv/mariadb/setup_openhospital.sh

    - name: Copiar script dentro del contenedor
      command: docker cp /srv/mariadb/setup_openhospital.sh openhospital_db:/setup_openhospital.sh

    - name: Configurar DNS en /etc/resolv.conf
      lineinfile:
        path: /etc/resolv.conf
        line: "{{ item }}"
        state: present
      loop:
        - "nameserver 8.8.8.8"
        - "nameserver 1.1.1.1"

    - name: Ejecutar script dentro del contenedor
      command: docker exec -it openhospital_db bash /setup_openhospital.sh
